unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded."

set -g prefix C-s

set -g mouse on
set-window-option -g mode-keys vi

set -g base-index 1
setw -g pane-base-index 1
# setw -g automatic-rename off

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key z display-popup -d "#{pane_current_path}"
bind-key y display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit"
bind-key u display-popup -w 80% -h 80% -E "btop"

set-option -g status-position top
# set -g default-terminal "screen-256color"

# --- Recommended settings for Claude Code ---
# True color / 256 color support so the TUI renders correctly
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:Tc"
set -ag terminal-features ",*:RGB"
# Low escape time so Alt/Option keybindings and vi mode respond instantly
set -sg escape-time 10
# Let tmux know when the terminal gains/loses focus (auto-refresh, etc.)
set -g focus-events on
# Large scrollback so long Claude Code output stays available
set -g history-limit 100000
# Share yanked text with the system clipboard (OSC 52)
set -g set-clipboard on
# Allow programs to pass escape sequences through tmux (images, OSC 52, etc.)
set -g allow-passthrough on
# --- End Claude Code settings ---

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
# For TPM, instead use `run ~/.tmux/plugins/tmux/catppuccin.tmux`

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_index}"
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"

# run ~/.config/tmux/plugins/tmux-plugins/tmux-cpu/cpu.tmux
# run ~/.config/tmux/plugins/tmux-plugins/tmux-battery/battery.tmux
